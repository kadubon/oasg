name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: base / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.28'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Sync
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check
      - name: Mypy
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest
      - name: README smoke
        run: |
          uv run oasg doctor
          uv run oasg demo quickstart --out .tmp/quickstart
          uv run oasg conformance run examples/conformance
  native:
    name: native / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.14']
    env:
      OASG_REQUIRE_NATIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.28'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --locked --group native
      - name: Native lifecycle, faults, independent oracles and subprocess coverage
        run: uv run --group native pytest tests -k collective --cov=oasg.collective --cov-branch --cov-report=json:coverage.json --cov-report=term-missing
      - name: Per-module statement and branch gates
        run: uv run python scripts/check_collective_coverage.py coverage.json --out coverage-gates.json
      - name: Candidate package qualification outside checkout
        run: |
          uv build
          uv run twine check dist/*
          uv export --locked --group native --no-dev --no-emit-project --format requirements-txt --output-file native-requirements.txt
          uv run python -c "import importlib.metadata,subprocess,sys; subprocess.run([sys.executable,'scripts/qualify_artifacts.py','--requirements','native-requirements.txt','--version',importlib.metadata.version('oasg'),'--out','candidate-qualification.json'],check=True)"
