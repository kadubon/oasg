name: Qualified release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact unused package version (accepted main commit only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: oasg-release
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.28'
          python-version: '3.12'
          enable-cache: false
      - name: Require accepted main and unused version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          uv run python -c 'import os,tomllib; assert tomllib.load(open("pyproject.toml","rb"))["project"]["version"] == os.environ["VERSION"]'
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then exit 1; fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" > checks.json
          uv run python -c 'import json; rows=[r for r in json.load(open("checks.json"))["check_runs"] if r["name"].startswith(("base /", "native /"))]; assert len(rows)==12 and all(r["conclusion"]=="success" for r in rows)'
      - run: uv sync --locked --group native
      - run: uv run ruff check
      - run: uv run mypy src
      - name: Regressions and mandatory native coverage
        env:
          OASG_REQUIRE_NATIVE: '1'
        run: |
          mkdir release-evidence
          uv run --group native pytest --cov=oasg.collective --cov-branch --cov-report=json:coverage.json
          uv run python scripts/check_collective_coverage.py coverage.json --out release-evidence/coverage-gates.json
          uv run python scripts/audit_public_files.py > release-evidence/source-scan.json
          uv run pip-audit -l --format json --output release-evidence/dependency-audit.json
      - name: Build once and qualify these bytes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          uv build
          uv run twine check dist/*
          uv export --locked --group native --no-dev --no-emit-project --format requirements-txt --output-file release-evidence/native-requirements.txt > /dev/null
          uv run python scripts/qualify_artifacts.py --requirements release-evidence/native-requirements.txt --version "$VERSION" --out release-evidence/qualification.json
          uv run python scripts/release_manifest.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualified-release
          path: |
            dist/*
            release-evidence/*
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: qualify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release
      - run: cd dist && sha256sum --check ../release-evidence/SHA256SUMS
      - name: Publish unchanged distributions using registered OIDC identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
  github-release:
    needs: [qualify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release
      - name: Create tag and release for qualified source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cd dist && sha256sum --check ../release-evidence/SHA256SUMS && cd ..
          gh release create "v$VERSION" dist/* release-evidence/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OASG $VERSION — Alpha collective workflow integration" --notes "Opt-in executed finite CCR/OAWM/VEK integration. See the attached qualification manifest and canonical collective-profile guide. No empirical AI acceleration claim. Public-install verification is reported separately."
  public-install:
    needs: [publish, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-release
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.28'
          python-version: '3.12'
          enable-cache: false
      - name: Fresh public wheel and sdist with offline runtime
        env:
          VERSION: ${{ inputs.version }}
        run: uv run python scripts/qualify_artifacts.py --public --requirements release-evidence/native-requirements.txt --version "$VERSION" --out public-install.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-install-verification
          path: public-install.json
